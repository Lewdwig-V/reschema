name: ci
# push: main only (post-merge verification); PR branches run via pull_request
# (in-repo branches otherwise trigger BOTH events = identical duplicate runs).
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y build-essential
      - run: uv sync
      - run: podman build -t localhost/reschema-toolchain:1 -f Containerfile .
      - run: uv run ruff check src tests
      - run: uv run pytest -x -q -n auto
