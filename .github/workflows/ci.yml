name: ci
# push: main only (post-merge verification); PR branches run via pull_request
# (in-repo branches otherwise trigger BOTH events = identical duplicate runs).
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # Deliberately NO build-essential: this job is the clean-runner proof that
      # no host compiler is needed anywhere (#61/#65 moved every compile into the
      # pinned image). If a future dep needs a host toolchain, add it back WITH a
      # comment naming the dep — never silently.
      - run: uv sync
      - run: podman build -t localhost/reschema-toolchain:1 -f Containerfile .
      - run: uv run ruff check src tests
      - run: uv run pytest -x -q -n auto
